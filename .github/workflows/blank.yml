# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5

      # Install musl-tools for static compilation
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools build-essential gcc make git

      # Build PCRE2 with static linking
      - name: Build PCRE2 static library
        run: |
          cd ${{ github.workspace }}
          # Download and extract PCRE2
          pcreuri=$(basename $(curl -sL -o /dev/null -w "%{url_effective}" https://github.com/PCRE2Project/pcre2/releases/latest))
          downpuri="https://github.com/PCRE2Project/pcre2/releases/download/${pcreuri}/${pcreuri}.tar.gz"
          wget $downpuri
          tar xzf *.tar.gz
          cd ${pcreuri}
          
          # Configure and build with musl-gcc for static compilation
          CC=musl-gcc ./configure --prefix=${{ github.workspace }}/pcre2_static --enable-static --disable-shared
          make
          make install
          cd ..

      # Cache PCRE2 static library for use in other jobs/runs
      - name: Cache PCRE2 static library
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/pcre2_static
          key: pcre2-static-${{ runner.os }}-${{ hashFiles('**/pcre2_static/lib/**') }}
          restore-keys: |
            pcre2-static-${{ runner.os }}-

      # Upload PCRE2 as artifact for other jobs to download
      - name: Upload PCRE2 static library artifact
        uses: actions/upload-artifact@v3
        with:
          name: pcre2-static-lib
          path: ${{ github.workspace }}/pcre2_static
          retention-days: 30

      # Export environment variables for subsequent steps
      - name: Export PCRE2 environment variables
        run: |
          echo "PCRE2_PREFIX=${{ github.workspace }}/pcre2_static" >> $GITHUB_ENV
          echo "PCRE2_LDFLAGS=-L${{ github.workspace }}/pcre2_static/lib -lpcre2-8" >> $GITHUB_ENV
          echo "PCRE2_CFLAGS=-I${{ github.workspace }}/pcre2_static/include" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${{ github.workspace }}/pcre2_static/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      # Runs a single command using the runners shell
      - name: zlib
        run: |
         wget 'https://zlib.net/current/zlib.tar.gz'
         tar xzf zlib.tar.gz
         

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
